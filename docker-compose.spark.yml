version: '3.8'

# Spark standalone cluster for PySpark feature engineering.
# Usage:
#   docker-compose -f docker-compose.spark.yml up --abort-on-container-exit
#
# Spark UI:  http://localhost:8080
# Output:    data/processed/spark_features/ (partitioned Parquet by Store/Week)

services:
  spark-master:
    image: bitnami/spark:3
    container_name: spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_MASTER_OPTS=-Dspark.deploy.defaultCores=2
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  spark-worker:
    image: bitnami/spark:3
    container_name: spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      spark-master:
        condition: service_healthy

  spark-job:
    image: bitnami/spark:3
    container_name: spark_feature_job
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
    volumes:
      - ./data:/opt/bitnami/spark/work-dir/data
      - ./spark:/opt/bitnami/spark/work-dir/spark
    working_dir: /opt/bitnami/spark/work-dir
    environment:
      - INPUT_PATH=/opt/bitnami/spark/work-dir/data
      - OUTPUT_PATH=/opt/bitnami/spark/work-dir/data/processed/spark_features
    command: >
      spark-submit
      --master spark://spark-master:7077
      --name "walmart-feature-engineering"
      --conf spark.sql.shuffle.partitions=50
      --conf spark.executor.memory=1g
      spark/feature_pipeline.py
