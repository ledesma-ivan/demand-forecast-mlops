version: '3.8'

# Spark standalone cluster for PySpark feature engineering.
# Usage:
#   docker-compose -f docker-compose.spark.yml up --abort-on-container-exit
#
# Spark UI:  http://localhost:8080
# Output:    data/processed/spark_features/ (partitioned Parquet by Store/Week)

services:
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark_master
    user: root
    environment:
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8080:8080"
      - "7077:7077"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark_worker
    user: root
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy

  spark-job:
    image: apache/spark:3.5.0
    container_name: spark_feature_job
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
    volumes:
      - ./data:/opt/spark/work-dir/data
      - ./spark:/opt/spark/work-dir/spark
    working_dir: /opt/spark/work-dir
    environment:
      - INPUT_PATH=/opt/spark/work-dir/data
      - OUTPUT_PATH=/opt/spark/work-dir/data/processed/spark_features
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --name "walmart-feature-engineering"
      --conf spark.sql.shuffle.partitions=50
      --conf spark.executor.memory=1g
      spark/feature_pipeline.py
